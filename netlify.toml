[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Dar más tiempo a la función (evita el corte a los 10s con varias fotos)
[functions]
  node_bundler = "esbuild"

[functions."chat"]
  # segundos máximos (hasta 26 en plan gratis background no; en normal el máx efectivo lo fija Netlify)
  included_files = []
